name: Project Ops Agent MVP

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: "실행할 프로젝트 설정 파일 경로"
        required: false
        default: "configs/projects/github.sample.project.toml"
        type: string
  # 주기 실행이 필요하면 아래 schedule 주석을 해제합니다.
  # schedule:
  #   - cron: "*/10 * * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: git 작성자 설정
        run: |
          git config user.name "project-ops-agent[bot]"
          git config user.email "project-ops-agent[bot]@users.noreply.github.com"

      - name: 에이전트 설치
        run: python -m pip install -e .

      - name: 대기 중인 이슈 스캔
        run: python -m project_ops_agent.cli scan --config "$CONFIG_PATH"
        env:
          CONFIG_PATH: ${{ github.event.inputs.config_path || 'configs/projects/github.sample.project.toml' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONDONTWRITEBYTECODE: "1"
