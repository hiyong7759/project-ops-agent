[project]
name = "project-ops-agent"
version = "0.1.0"
description = "Single-project operations agent for issue triage, clarification, verification, and MR/PR reporting."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
project-ops-agent = "project_ops_agent.cli:main"
gitlab-project-ops-agent = "project_ops_agent.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
